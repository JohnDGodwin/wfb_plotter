<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Browser</title>
    <link rel="stylesheet" href="styles.css">
    <script>
    // Load current config from server (if available) into a JS object
    let configData = {{ config|tojson if config else "{}" | safe }};

    // Switch to a selected file
    function onFileChange() {
      const selectedFile = document.getElementById('whitelist').value;
      if (selectedFile) {
        window.location.href = `/config-editor?file=${encodeURIComponent(selectedFile)}`;
      } else {
        // If user picks blank, just go to /config-editor
        window.location.href = '/config-editor';
      }
    }

    // Render the configData into the DOM
    function renderConfig() {
      const container = document.getElementById("config-sections");
      container.innerHTML = "";

      // For each section in configData
      for (const [section, settings] of Object.entries(configData)) {
        const fieldset = document.createElement("fieldset");
        fieldset.className = "border p-3 mb-4";

        // Legend (section name only; no remove button)
        const legend = document.createElement("legend");
        legend.className = "w-auto";
        legend.textContent = section;
        fieldset.appendChild(legend);

        // For each setting in this section
        for (const [key, value] of Object.entries(settings)) {
          const row = document.createElement("div");
          row.className = "mb-3 d-flex align-items-center";

          // Key label
          const label = document.createElement("label");
          label.className = "form-label me-2 mb-0";
          label.innerHTML = `<strong>${key}</strong>`;

          // Text input for value
          const input = document.createElement("input");
          input.type = "text";
          input.className = "form-control me-2";
          input.value = value;
          input.style.maxWidth = "400px";

          row.appendChild(label);
          row.appendChild(input);
          fieldset.appendChild(row);
        }

        container.appendChild(fieldset);
      }
    }

    // Gather data from UI inputs and submit as JSON
    function prepareAndSubmit() {
      // Re-scan the rendered inputs
      const container = document.getElementById("config-sections");
      const fieldsets = container.querySelectorAll("fieldset");
      const newConfig = {};

      fieldsets.forEach(fieldset => {
        const legendEl = fieldset.querySelector("legend");
        if (!legendEl) return;

        const sectionName = legendEl.innerText.trim();
        newConfig[sectionName] = {};

        // Each row (div.mb-3.d-flex)
        const rows = fieldset.querySelectorAll("div.mb-3.d-flex");
        rows.forEach(row => {
          const label = row.querySelector("label");
          const input = row.querySelector("input");
          if (!label || !input) return;
          const key = label.innerText.trim();
          const val = input.value;
          newConfig[sectionName][key] = val;
        });
      });

      document.getElementById("config_json").value = JSON.stringify(newConfig);
      document.getElementById("configForm").submit();
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderConfig();
    });
  </script>
</head>
<body>
  <h1>File Browser</h1>
  <p>View and manage files in the /media directory.</p>

  <button id="refreshBtn">Refresh File List</button>
  <div id="filesContainer">
    <!-- File table or message will be inserted here by JavaScript -->
  </div>
  <div id="statusMessage"></div>

  <script>
    const filesContainer = document.getElementById('filesContainer');
    const statusMessage = document.getElementById('statusMessage');
    const refreshBtn = document.getElementById('refreshBtn');

    refreshBtn.addEventListener('click', () => {
      loadFiles();
    });

    function loadFiles() {
      statusMessage.textContent = "Loading files...";
      fetch('/files')
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            filesContainer.innerHTML = `<p style="color:red;">Error: ${data.error}</p>`;
            statusMessage.textContent = "";
            return;
          }

          const directory = data.directory;
          let files = data.files || [];

          // Sort the files alphabetically by name
          files.sort((a, b) => a.name.localeCompare(b.name));

          renderFiles(directory, files);
          statusMessage.textContent = "";
        })
        .catch(err => {
          filesContainer.innerHTML = `<p style="color:red;">Error fetching file list: ${err}</p>`;
          statusMessage.textContent = "";
        });
    }

    function renderFiles(directory, files) {
      if (!files || files.length === 0) {
        filesContainer.innerHTML = `<p>No files found in <strong>${directory}</strong></p>`;
        return;
      }

      let html = `
        <p>Listing files in <strong>${directory}</strong>:</p>
        <table>
          <thead>
            <tr>
              <th>File Name</th>
              <th>Size (bytes)</th>
              <th>Last Modified</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      for (const file of files) {
        const encodedName = encodeURIComponent(file.name);
        html += `
          <tr>
            <td>${file.name}</td>
            <td>${file.size}</td>
            <td>${file.modified}</td>
            <td>
              <button onclick="downloadFile('${encodedName}')">Download</button>
              <button onclick="deleteFile('${encodedName}')">Delete</button>
            </td>
          </tr>
        `;
      }

      html += `
          </tbody>
        </table>
      `;

      filesContainer.innerHTML = html;
    }

    function downloadFile(encodedName) {
      const url = '/files/download/' + encodedName;
      window.open(url, '_blank');
    }

    function deleteFile(encodedName) {
      if (!confirm('Are you sure you want to delete this file?')) {
        return;
      }
      statusMessage.textContent = "Deleting file...";

      fetch('/files/delete/' + encodedName, { method: 'POST' })
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            alert('Error: ' + data.error);
          } else if (data.success) {
            alert(data.message || "File deleted.");
          }
          loadFiles();
        })
        .catch(err => {
          alert("Error deleting file: " + err);
        })
        .finally(() => {
          statusMessage.textContent = "";
        });
    }

    // Auto-load files on page load
    document.addEventListener('DOMContentLoaded', loadFiles);
  </script>
</body>
</html>
