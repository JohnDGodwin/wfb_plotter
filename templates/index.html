<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        h1 {
            margin-bottom: 20px;
        }

        .controls {
            margin: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .controls button, 
        .controls a {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .controls button:hover, 
        .controls a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Landing Page</h1>
    <div class="controls">
        <a href="/file-browser">File Browser</a>
        <a href="/config-editor">Config editor</a>
    </div>
</body>
</html>
