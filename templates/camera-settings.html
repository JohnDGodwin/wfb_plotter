<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Settings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Camera Settings</h1>
            <a href="/" class="btn btn-primary">Return to Front Page</a>
        </div>

        <div class="row">
            <!-- FPS Settings -->
            <div class="col mb-4">
                <form action="/camera/fps" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">FPS Settings</legend>
                        <div class="mb-3">
                            <label for="fps" class="form-label">Camera FPS</label>
                            <input type="number" id="fps" name="fps" class="form-control" value="60" min="1" max="120" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update FPS</button>
                    </fieldset>
                </form>
            </div>

            <!-- Resolution Settings -->
            <div class="col mb-4">
                <form action="/camera/resolution" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">Resolution Settings</legend>
                        <div class="mb-3">
                            <label for="resolution" class="form-label">Camera Resolution</label>
                            <select id="resolution" name="resolution" class="form-control" required>
                                <option value="1920x1080">1920x1080 (1080p)</option>
                                <option value="1280x720">1280x720 (720p)</option>
                                <option value="3840x2160">3840x2160 (4K)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Resolution</button>
                    </fieldset>
                </form>
            </div>

            <!-- Bitrate Settings -->
            <div class="col mb-4">
                <form action="/camera/bitrate" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">Bitrate Settings</legend>
                        <div class="mb-3">
                            <label for="bitrate" class="form-label">Camera Bitrate (kbps)</label>
                            <input type="number" id="bitrate" name="bitrate" class="form-control" value="4096" min="1000" max="20000" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Bitrate</button>
                    </fieldset>
                </form>
            </div>
        </div>

        <!-- WFB Settings -->
        <div class="row">
            <!-- Channel Settings -->
            <div class="col mb-4">
                <form action="/camera/channel" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">Channel Settings</legend>
                        <div class="mb-3">
                            <label for="channel" class="form-label">WiFi Channel</label>
                            <input type="number" id="channel" name="channel" class="form-control" value="161" min="1" max="165" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Channel</button>
                    </fieldset>
                </form>
            </div>

            <!-- TX Power Override -->
            <div class="col mb-4">
                <form action="/camera/txpower" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">TX Power Settings</legend>
                        <div class="mb-3">
                            <label for="txpower" class="form-label">TX Power Override</label>
                            <input type="number" id="txpower" name="txpower" class="form-control" value="1" min="0" max="1" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update TX Power</button>
                    </fieldset>
                </form>
            </div>

            <!-- STBC Settings -->
            <div class="col mb-4">
                <form action="/camera/stbc" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">STBC Settings</legend>
                        <div class="mb-3">
                            <label for="stbc" class="form-label">STBC Enable</label>
                            <input type="number" id="stbc" name="stbc" class="form-control" value="0" min="0" max="1" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update STBC</button>
                    </fieldset>
                </form>
            </div>
        </div>

        <div class="row">
            <!-- LDPC Settings -->
            <div class="col mb-4">
                <form action="/camera/ldpc" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">LDPC Settings</legend>
                        <div class="mb-3">
                            <label for="ldpc" class="form-label">LDPC Enable</label>
                            <input type="number" id="ldpc" name="ldpc" class="form-control" value="0" min="0" max="1" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update LDPC</button>
                    </fieldset>
                </form>
            </div>

            <!-- MCS Index Settings -->
            <div class="col mb-4">
                <form action="/camera/mcs" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">MCS Index Settings</legend>
                        <div class="mb-3">
                            <label for="mcs" class="form-label">MCS Index</label>
                            <input type="number" id="mcs" name="mcs" class="form-control" value="1" min="0" max="7" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update MCS Index</button>
                    </fieldset>
                </form>
            </div>

            <!-- FEC Settings -->
            <div class="col mb-4">
                <form action="/camera/fec" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">FEC Settings</legend>
                        <div class="mb-3">
                            <label for="fec_k" class="form-label">FEC K</label>
                            <input type="number" id="fec_k" name="fec_k" class="form-control" value="8" min="1" max="16" required>
                        </div>
                        <div class="mb-3">
                            <label for="fec_n" class="form-label">FEC N</label>
                            <input type="number" id="fec_n" name="fec_n" class="form-control" value="12" min="1" max="16" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update FEC</button>
                    </fieldset>
                </form>
            </div>
        </div>

        <!-- Reboot Camera -->
        <div class="mb-4">
            <form action="/camera/reboot" method="POST" onsubmit="return confirm('Are you sure you want to reboot the camera?');">
                <fieldset class="border p-3">
                    <legend class="w-auto">Camera Control</legend>
                    <button type="submit" class="btn btn-danger">Reboot Camera</button>
                </fieldset>
            </form>
        </div>

        <!-- Status Messages -->
        <div id="status-message" class="alert alert-info" style="display: none;"></div>
    </div>

    <script>
        // Show status messages
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status-message');
            statusDiv.textContent = message;
            statusDiv.className = `alert alert-${type}`;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        // Handle form submissions
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    showStatus(data.message, data.success ? 'success' : 'danger');
                } catch (error) {
                    showStatus('An error occurred', 'danger');
                }
            });
        });
    </script>
</body>
</html>
