<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Settings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Camera Settings</h1>
            <div>
                <button onclick="loadWFBConfig()" class="btn btn-secondary me-2">Load WFB Config</button>
                <a href="/" class="btn btn-primary">Return to Front Page</a>
            </div>
        </div>

        <div class="row">
            <!-- Existing Camera Settings -->
            <div class="col mb-4">
                <form action="/camera/fps" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">FPS Settings</legend>
                        <div class="mb-3">
                            <label for="fps" class="form-label">Camera FPS</label>
                            <input type="number" id="fps" name="fps" class="form-control" value="60" min="1" max="120" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update FPS</button>
                    </fieldset>
                </form>
            </div>

            <!-- Resolution Settings -->
            <div class="col mb-4">
                <form action="/camera/resolution" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">Resolution Settings</legend>
                        <div class="mb-3">
                            <label for="resolution" class="form-label">Camera Resolution</label>
                            <select id="resolution" name="resolution" class="form-control" required>
                                <option value="1920x1080">1920x1080 (1080p)</option>
                                <option value="1280x720">1280x720 (720p)</option>
                                <option value="3840x2160">3840x2160 (4K)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Resolution</button>
                    </fieldset>
                </form>
            </div>

            <!-- Bitrate Settings -->
            <div class="col mb-4">
                <form action="/camera/bitrate" method="POST" class="mb-4">
                    <fieldset class="border p-3">
                        <legend class="w-auto">Bitrate Settings</legend>
                        <div class="mb-3">
                            <label for="bitrate" class="form-label">Camera Bitrate (kbps)</label>
                            <input type="number" id="bitrate" name="bitrate" class="form-control" value="4096" min="1000" max="20000" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Bitrate</button>
                    </fieldset>
                </form>
            </div>
        </div>

        <!-- WFB Configuration Section -->
        <div class="row mb-4">
            <div class="col">
                <form id="wfb-config-form" class="border p-3">
                    <legend class="w-auto">WFB Configuration</legend>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="channel" class="form-label">Channel</label>
                            <input type="number" id="channel" name="channel" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="txpower" class="form-label">TX Power Override</label>
                            <input type="number" id="txpower" name="driver_txpower_override" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="mcs_index" class="form-label">MCS Index</label>
                            <input type="number" id="mcs_index" name="mcs_index" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="stbc" class="form-label">STBC</label>
                            <input type="number" id="stbc" name="stbc" class="form-control" min="0" max="1" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="ldpc" class="form-label">LDPC</label>
                            <input type="number" id="ldpc" name="ldpc" class="form-control" min="0" max="1" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="fec_k" class="form-label">FEC K</label>
                            <input type="number" id="fec_k" name="fec_k" class="form-control" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="fec_n" class="form-label">FEC N</label>
                            <input type="number" id="fec_n" name="fec_n" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Reboot Camera -->
        <div class="mb-4">
            <form action="/camera/reboot" method="POST" onsubmit="return confirm('Are you sure you want to reboot the camera?');">
                <fieldset class="border p-3">
                    <legend class="w-auto">Camera Control</legend>
                    <button type="submit" class="btn btn-danger">Reboot Camera</button>
                </fieldset>
            </form>
        </div>

        <!-- Status Messages -->
        <div id="status-message" class="alert alert-info" style="display: none;"></div>
    </div>

    <script>
        // Show status messages
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status-message');
            statusDiv.textContent = message;
            statusDiv.className = `alert alert-${type}`;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        // Load WFB Configuration
        async function loadWFBConfig() {
            try {
                const response = await fetch('/camera/read-wfb-config');
                const data = await response.json();
                
                if (data.success) {
                    // Fill in the form fields with the config values
                    const config = data.config;
                    Object.keys(config).forEach(key => {
                        const element = document.getElementById(key);
                        if (element) {
                            element.value = config[key];
                        }
                    });
                    showStatus('WFB Configuration loaded successfully', 'success');
                } else {
                    showStatus(data.message || 'Failed to load WFB configuration', 'danger');
                }
            } catch (error) {
                showStatus('Error loading WFB configuration', 'danger');
                console.error('Error:', error);
            }
        }

        // Handle form submissions
        document.querySelectorAll('form').forEach(form => {
            if (form.id !== 'wfb-config-form') {  // Skip the WFB config form
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const formData = new FormData(form);
                    try {
                        const response = await fetch(form.action, {
                            method: 'POST',
                            body: formData
                        });
                        const data = await response.json();
                        showStatus(data.message, data.success ? 'success' : 'danger');
                    } catch (error) {
                        showStatus('An error occurred', 'danger');
                    }
                });
            }
        });
    </script>
</body>
</html>
