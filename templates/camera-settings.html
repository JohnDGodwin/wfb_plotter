<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Settings</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Existing styles remain the same */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .settings-section {
            background-color: #fff;
            border-radius: 0.25rem;
            padding: 1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (min-width: 768px) {
            .form-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 992px) {
            .form-row {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .form-group {
            margin-bottom: 1rem;
        }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        legend {
            padding: 0 0.5rem;
            font-weight: 500;
        }

        .header-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* New styles for ping status */
        .btn-ping {
            position: relative;
            transition: background-color 0.3s ease;
        }

        .btn-ping.online {
            background-color: #28a745;  /* Green */
            border-color: #28a745;
        }

        .btn-ping.offline {
            background-color: #dc3545;  /* Red */
            border-color: #dc3545;
        }

        @media (max-width: 576px) {
            .header-container {
                flex-direction: column;
                align-items: stretch;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <h1>Camera Settings</h1>
            <div class="button-group">
                <button onclick="loadAllConfigs()" id="readSettingsBtn" class="btn btn-secondary btn-ping">Read Camera Settings</button>
                <button onclick="updateAllSettings()" class="btn btn-primary">Update All Settings</button>
                <a href="/" class="btn btn-primary">Return to Front Page</a>
            </div>
        </div>

        <form id="cameraSettingsForm">
            <div class="settings-grid">
                <!-- Video Settings -->
                <div class="settings-section">
                    <fieldset>
                        <legend>Video Settings</legend>
                        <div class="form-group">
                            <label for="fps" class="form-label">Camera FPS</label>
                            <input type="number" id="fps" name="fps" class="form-control" value="60" min="1" max="120" required>
                        </div>
                        <div class="form-group">
                            <label for="resolution" class="form-label">Camera Resolution</label>
                            <select id="resolution" name="resolution" class="form-control" required>
                                <option value="1920x1080">1920x1080 (1080p)</option>
                                <option value="1280x720">1280x720 (720p)</option>
                                <option value="3840x2160">3840x2160 (4K)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="bitrate" class="form-label">Camera Bitrate (kbps)</label>
                            <input type="number" id="bitrate" name="bitrate" class="form-control" value="4096" min="1000" max="20000" required>
                        </div>
                    </fieldset>
                </div>

                <!-- WFB Configuration Section -->
                <div class="settings-section">
                    <fieldset>
                        <legend>WFB Configuration</legend>
                        <div class="form-group">
                            <label for="channel" class="form-label">Channel</label>
                            <input type="number" id="channel" name="channel" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="txpower" class="form-label">TX Power Override</label>
                            <input type="number" id="txpower" name="txpower" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="mcs_index" class="form-label">MCS Index</label>
                            <input type="number" id="mcs_index" name="mcs_index" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="stbc" class="form-label">STBC</label>
                            <input type="number" id="stbc" name="stbc" class="form-control" min="0" max="1" required>
                        </div>
                        <div class="form-group">
                            <label for="ldpc" class="form-label">LDPC</label>
                            <input type="number" id="ldpc" name="ldpc" class="form-control" min="0" max="1" required>
                        </div>
                        <div class="form-group">
                            <label for="fec_k" class="form-label">FEC K</label>
                            <input type="number" id="fec_k" name="fec_k" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="fec_n" class="form-label">FEC N</label>
                            <input type="number" id="fec_n" name="fec_n" class="form-control" required>
                        </div>
                    </fieldset>
                </div>
            </div>

            <!-- Universal Update Button -->
            <div class="settings-section">
                <button type="button" onclick="updateAllSettings()" class="btn btn-primary">Update All Settings</button>
            </div>
        </form>

        <!-- Reboot Camera -->
        <div class="settings-section">
            <form action="/camera/reboot" method="POST" onsubmit="return confirm('Are you sure you want to reboot the camera?');">
                <fieldset>
                    <legend>Camera Control</legend>
                    <button type="submit" class="btn btn-danger">Reboot Camera</button>
                </fieldset>
            </form>
        </div>

        <!-- Status Messages -->
        <div id="status-message" class="alert alert-info" style="display: none;"></div>
    </div>

      <script>
        // Add ping check functionality
        let pingInterval;

        async function checkCameraStatus() {
            try {
                const response = await fetch('/camera/ping-status');
                const data = await response.json();
                const btn = document.getElementById('readSettingsBtn');
                
                if (data.success) {
                    btn.classList.remove('offline');
                    btn.classList.add('online');
                } else {
                    btn.classList.remove('online');
                    btn.classList.add('offline');
                }
            } catch (error) {
                console.error('Error checking camera status:', error);
                const btn = document.getElementById('readSettingsBtn');
                btn.classList.remove('online');
                btn.classList.add('offline');
            }
        }

        // Start periodic ping checks when page loads
        document.addEventListener('DOMContentLoaded', () => {
            checkCameraStatus(); // Initial check
            pingInterval = setInterval(checkCameraStatus, 5000); // Check every 5 seconds
            loadAllConfigs(); // Load initial configs
        });

        // Clean up interval when page is unloaded
        window.addEventListener('beforeunload', () => {
            if (pingInterval) {
                clearInterval(pingInterval);
            }
        });

        // Existing functions remain the same
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status-message');
            statusDiv.textContent = message;
            statusDiv.className = `alert alert-${type}`;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        async function loadAllConfigs() {
            try {
                const response = await fetch('/camera/read-all-configs');
                const data = await response.json();
                
                if (data.success) {
                    // Fill in WFB config fields
                    const wfb_config = data.wfb_config;
                    Object.keys(wfb_config).forEach(key => {
                        const element = document.getElementById(key);
                        if (element) {
                            element.value = wfb_config[key];
                        }
                    });

                    // Fill in video settings
                    const video_settings = data.video_settings;
                    if (video_settings.fps) {
                        document.getElementById('fps').value = video_settings.fps;
                    }
                    if (video_settings.bitrate) {
                        document.getElementById('bitrate').value = video_settings.bitrate;
                    }
                    if (video_settings.size) {
                        document.getElementById('resolution').value = video_settings.size;
                    }

                    showStatus('Camera settings loaded successfully', 'success');
                } else {
                    showStatus(data.message || 'Failed to load configurations', 'danger');
                }
            } catch (error) {
                showStatus('Error loading configurations', 'danger');
                console.error('Error:', error);
            }
        }

        async function updateAllSettings() {
            const settings = {
                fps: document.getElementById('fps').value,
                resolution: document.getElementById('resolution').value,
                bitrate: document.getElementById('bitrate').value,
                channel: document.getElementById('channel').value,
                txpower: document.getElementById('txpower').value,
                mcs: document.getElementById('mcs_index').value,
                stbc: document.getElementById('stbc').value,
                ldpc: document.getElementById('ldpc').value,
                fec_k: document.getElementById('fec_k').value,
                fec_n: document.getElementById('fec_n').value
            };

            const updates = [
                updateSetting('/camera/fps', { fps: settings.fps }),
                updateSetting('/camera/resolution', { resolution: settings.resolution }),
                updateSetting('/camera/bitrate', { bitrate: settings.bitrate }),
                updateSetting('/camera/channel', { channel: settings.channel }),
                updateSetting('/camera/txpower', { txpower: settings.txpower }),
                updateSetting('/camera/mcs', { mcs: settings.mcs }),
                updateSetting('/camera/stbc', { stbc: settings.stbc }),
                updateSetting('/camera/ldpc', { ldpc: settings.ldpc }),
                updateSetting('/camera/fec', { fec_k: settings.fec_k, fec_n: settings.fec_n })
            ];

            try {
                showStatus('Updating settings...', 'info');
                await Promise.all(updates);
                showStatus('All settings updated successfully', 'success');
            } catch (error) {
                showStatus('Error updating some settings', 'danger');
                console.error('Error:', error);
            }
        }

        async function updateSetting(endpoint, data) {
            const formData = new FormData();
            Object.entries(data).forEach(([key, value]) => {
                formData.append(key, value);
            });

            const response = await fetch(endpoint, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error(`Failed to update ${endpoint}`);
            }

            return response.json();
        }
    </script>
</body>
</html>
